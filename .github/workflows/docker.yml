# Publie l'image LumiR sur GHCR, pour la deployer comme service web
# (template OxaDash) sans passer par install.sh.
#
# Volontairement separe de release.yml : celui-ci produit les tarballs
# d'installation systemd et incremente les tags. Melanger les deux ferait
# echouer la release entiere sur un simple probleme de build d'image.
name: Docker Image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` sur master, plus un tag immuable par version et par commit :
      # un deploiement doit pouvoir epingler autre chose qu'un tag mouvant.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lumir
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
