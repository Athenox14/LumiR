name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (ex: v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write build info
        run: |
          echo "${{ github.sha }}" > BUILD_SHA
          echo "${{ inputs.version }}" > BUILD_VERSION

      - name: Build
        run: npm run build

      - name: Include build info in output
        run: |
          cp BUILD_SHA .output/BUILD_SHA
          cp BUILD_VERSION .output/BUILD_VERSION

      - name: Zip build output
        run: |
          cd .output
          zip -r ../lumir-${{ inputs.version }}.zip .
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: LumiR ${{ inputs.version }}
          generate_release_notes: true
          files: lumir-${{ inputs.version }}.zip
