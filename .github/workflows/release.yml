name: Build & Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (ex: v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            DATE=$(date -u +%Y%m%d-%H%M%S)
            echo "tag=auto-${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write build info
        run: |
          echo "${{ github.sha }}" > BUILD_SHA
          echo "${{ steps.version.outputs.tag }}" > BUILD_VERSION

      - name: Build
        run: npm run build

      - name: Include build info in output
        run: |
          cp BUILD_SHA .output/BUILD_SHA
          cp BUILD_VERSION .output/BUILD_VERSION

      - name: Zip build output
        run: |
          cd .output
          zip -r ../lumir-${{ steps.version.outputs.tag }}.zip .
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LumiR ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: lumir-${{ steps.version.outputs.tag }}.zip
          prerelease: ${{ inputs.version == '' }}
