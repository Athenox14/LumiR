name: Build & Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (ex: v1.0.0). Leave empty to auto-increment patch.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Get the latest vX.Y.Z tag (strict semver only), auto-increment patch
            LATEST=$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
            if [ -z "$LATEST" ]; then
              echo "tag=v0.0.1" >> "$GITHUB_OUTPUT"
            else
              # Parse major.minor.patch and increment patch
              MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
              MINOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f2)
              PATCH=$(echo "$LATEST" | sed 's/v//' | cut -d. -f3)
              PATCH=$((PATCH + 1))
              echo "tag=v${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write build info
        run: |
          echo "${{ github.sha }}" > BUILD_SHA
          echo "${{ steps.version.outputs.tag }}" > BUILD_VERSION

      - name: Build
        run: npm run build

      - name: Include build info in output
        run: |
          cp BUILD_SHA .output/BUILD_SHA
          cp BUILD_VERSION .output/BUILD_VERSION

      - name: Zip build output
        run: |
          cd .output
          zip -r ../lumir-${{ steps.version.outputs.tag }}.zip .
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LumiR ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: lumir-${{ steps.version.outputs.tag }}.zip
